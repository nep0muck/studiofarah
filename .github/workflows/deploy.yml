name: Build and deploy to Hetzner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hetzner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build website, PDFs and QR codes
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Test deployment helper
        run: python3 -m unittest discover -s tests -v

      - name: Validate deployment files
        run: python3 scripts/deploy-ftps.py --source dist --dry-run

      - name: Upload to Hetzner using verified FTPS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HETZNER_DEPLOY_ENABLED == 'true'
        env:
          HETZNER_FTP_HOST: ${{ vars.HETZNER_FTP_HOST }}
          HETZNER_FTP_USERNAME: ${{ secrets.HETZNER_FTP_USERNAME }}
          HETZNER_FTP_PASSWORD: ${{ secrets.HETZNER_FTP_PASSWORD }}
          HETZNER_REMOTE_DIR: ${{ vars.HETZNER_REMOTE_DIR }}
        run: python3 scripts/deploy-ftps.py --source dist

      - name: Explain initial setup
        if: github.event_name != 'pull_request' && vars.HETZNER_DEPLOY_ENABLED != 'true'
        run: echo 'Build succeeded. Set the Hetzner repository variables and secrets, then HETZNER_DEPLOY_ENABLED=true to enable automatic uploads.' >> "$GITHUB_STEP_SUMMARY"
